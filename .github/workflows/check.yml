name: check

on:
  push:
    branches: [main]
  pull_request:

# The job only reads the tree. Nothing here needs to write to the repository,
# so say so rather than relying on the repository-wide default staying read.
permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit, not a tag. A tag can be moved to point
      # at different code after review; a commit cannot.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
